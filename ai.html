<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 晚餐推薦對話</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600&display=swap');
        body {
            font-family: 'Baloo 2', 'Microsoft JhengHei', cursive, sans-serif;
            background: linear-gradient(135deg, #ede7f6 0%, #e1bee7 100%);
            margin: 0; padding: 0;
            min-height: 100vh;
        }
        .container {
            max-width: 520px;
            margin: 48px auto 32px auto;
            background: rgba(255,255,255,0.98);
            border-radius: 24px;
            box-shadow: 0 4px 24px 0 #b39ddb, 0 1.5px 8px #ce93d8;
            padding: 32px 28px 24px 28px;
            border: 3px solid #b39ddb;
            position: relative;
        }
        .food-hero {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 12px;
        }
        .food-hero img {
            width: 120px;
            height: 120px;
            object-fit: contain;
            border-radius: 18px;
            box-shadow: 0 2px 12px #ce93d8;
            background: #ede7f6;
        }
        h1 {
            text-align: center;
            color: #7c4dff;
            font-family: 'Baloo 2', 'Microsoft JhengHei', cursive, sans-serif;
            font-size: 2.2rem;
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-shadow: 0 2px 8px #ce93d8, 0 1px 0 #fff;
        }
        #chat {
            height: 350px;
            overflow-y: auto;
            border: 2px solid #b39ddb;
            border-radius: 16px;
            padding: 16px 12px;
            background: linear-gradient(135deg, #f3e5f5 60%, #ede7f6 100%);
            margin-bottom: 16px;
            box-shadow: 0 2px 12px #ce93d8;
        }
        .msg {
            margin: 12px 0;
            font-size: 1.13rem;
            position: relative;
            z-index: 1;
        }
        .user {
            color: #7c4dff;
            font-weight: bold;
            background: #ede7f6;
            border-radius: 16px 16px 16px 0;
            display: inline-block;
            padding: 8px 16px;
            box-shadow: 0 1px 6px #ce93d8;
        }
        .ai {
            color: #fff;
            font-weight: bold;
            background: linear-gradient(90deg, #b39ddb 60%, #7c4dff 100%);
            border-radius: 16px 16px 0 16px;
            display: inline-block;
            padding: 8px 16px;
            box-shadow: 0 1px 6px #ce93d8;
        }
        #inputArea {
            display: flex;
            gap: 8px;
        }
        #userInput {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: 2px solid #b39ddb;
            font-size: 1.1rem;
            background: #f3e5f5;
            color: #6a1b9a;
            outline: none;
            transition: border 0.2s;
        }
        #userInput:focus {
            border: 2.5px solid #7c4dff;
        }
        #sendBtn {
            padding: 10px 22px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(90deg, #b39ddb 60%, #7c4dff 100%);
            color: #fff;
            font-size: 1.1rem;
            font-family: 'Baloo 2', 'Microsoft JhengHei', cursive, sans-serif;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 1px 6px #ce93d8;
            transition: background 0.2s;
        }
        #sendBtn:disabled {
            background: #ce93d8;
            color: #fff;
        }
        label {
            color: #6a1b9a;
            font-size: 1rem;
            font-family: 'Baloo 2', 'Microsoft JhengHei', cursive, sans-serif;
        }
        #apiKeyInput {
            border-radius: 8px;
            border: 2px solid #b39ddb;
            padding: 8px;
            background: #f3e5f5;
            color: #6a1b9a;
        }
        #saveKeyBtn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            background: #7c4dff;
            color: #fff;
            cursor: pointer;
            font-weight: bold;
        }
        #saveKeyBtn:active {
            background: #512da8;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 幾何造型裝飾 -->
        <svg width="100%" height="80" style="display:block; margin-bottom: -30px;" viewBox="0 0 520 80" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="60" cy="40" r="32" fill="#b39ddb" fill-opacity="0.18"/>
            <rect x="420" y="10" width="60" height="60" rx="18" fill="#7c4dff" fill-opacity="0.13"/>
            <polygon points="180,70 210,20 240,70" fill="#9575cd" fill-opacity="0.18"/>
            <ellipse cx="350" cy="40" rx="28" ry="16" fill="#ce93d8" fill-opacity="0.13"/>
        </svg>
        <h1>AI 晚餐推薦</h1>
        <div style="margin-bottom:12px; display:flex; gap:8px; align-items:center;">
            <label for="apiKeyInput" style="color:#1976d2;">Google AI API Key:</label>
            <input type="password" id="apiKeyInput" placeholder="請輸入API金鑰">
            <button id="saveKeyBtn">儲存金鑰</button>
        </div>
        <div id="chat"></div>
        <div id="inputArea">
            <input type="text" id="userInput" placeholder="請輸入你想吃什麼或問AI...">
            <button id="sendBtn">送出</button>
        </div>
    </div>
    <script>
    let API_KEY = '';
    let API_URL = '';
    const chat = document.getElementById('chat');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const saveKeyBtn = document.getElementById('saveKeyBtn');

    function appendMsg(sender, text) {
        const div = document.createElement('div');
        div.className = 'msg';
        div.innerHTML = `<span class="${sender}">${sender === 'user' ? '你' : 'AI'}：</span> ${text}`;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    function setApiKey(key) {
        API_KEY = key;
        API_URL = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=' + API_KEY;
        localStorage.setItem('gemini_api_key', key);
        apiKeyInput.value = key;
    }

    saveKeyBtn.onclick = () => {
        const key = apiKeyInput.value.trim();
        if (key) {
            setApiKey(key);
            appendMsg('ai', 'API 金鑰已儲存，請開始提問！');
        }
    };

    apiKeyInput.addEventListener('keydown', e => {
        if (e.key === 'Enter') saveKeyBtn.click();
    });

    window.onload = () => {
        const saved = localStorage.getItem('gemini_api_key');
        if (saved) setApiKey(saved);
    };

    async function askAI(question) {
        if (!API_KEY) {
            appendMsg('ai', '請先輸入 Google Gemini API 金鑰！');
            return;
        }
        appendMsg('user', question);
        sendBtn.disabled = true;
        userInput.value = '';
        try {
            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: `你是一個晚餐推薦專家，請根據使用者的需求推薦晚餐，並用繁體中文回答。問題：${question}` }] }]
                })
            });
            const data = await res.json();
            let aiText = '發生錯誤，請稍後再試';
            if (data && data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) {
                aiText = data.candidates[0].content.parts.map(p => p.text).join('');
            } else if (data.error && data.error.message) {
                aiText = 'API 錯誤：' + data.error.message;
            }
            appendMsg('ai', aiText);
        } catch (e) {
            appendMsg('ai', '無法連線到AI服務，請檢查網路或API金鑰');
        }
        sendBtn.disabled = false;
    }

    sendBtn.onclick = () => {
        const q = userInput.value.trim();
        if (q) askAI(q);
    };

    userInput.addEventListener('keydown', e => {
        if (e.key === 'Enter') sendBtn.click();
    });

    appendMsg('ai', '你好！請先輸入 Google Gemini API 金鑰，然後開始提問。');
    </script>
</body>
</html>
